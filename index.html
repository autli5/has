          for (let i = 0; i < VAST_PATTERNS.length; i++) {

        // 3. Network Interceptor: Block VAST & Casino Ad Requests in fetch()
        if (typeof window.fetch === "function") {
          const origFetch = window.fetch;
          window.fetch = function(input, init) {
            const url = typeof input === "string" ? input : (input && input.url ? input.url : "");
            if (isAdUrl(url)) {
              console.warn("[HAS AdGuard] Blocked ad fetch:", url);

        // 4. Network Interceptor: Block VAST & Casino Ad Requests in XMLHttpRequest
        if (typeof window.XMLHttpRequest === "function") {
          const origOpen = XMLHttpRequest.prototype.open;
          const origSend = XMLHttpRequest.prototype.send;
          XMLHttpRequest.prototype.open = function(method, url) {
            this._hasUrl = typeof url === "string" ? url : "";
            return origOpen.apply(this, arguments);
          };
          XMLHttpRequest.prototype.send = function() {
            if (isAdUrl(this._hasUrl)) {
              console.warn("[HAS AdGuard] Blocked XHR ad request:", this._hasUrl);
              this.abort();

            if (isVastUrl(this._hasUrl)) {

              setTimeout(() => {
                if (typeof this.onreadystatechange === "function") this.onreadystatechange();
                if (typeof this.onload === "function") this.onload();
              }, 10);
              return;
            }
            return origSend.apply(this, arguments);
          };
        }

        // 5. Click Interceptor for ad redirects
        document.addEventListener("click", function(e) {

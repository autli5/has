<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>has</title>
    <!-- HAS Cinema Anti-Popup & Safe Browsing Shield -->
    <script>
      (function() {
        // Anti-Popup & Tab Hijack Guard (Blocks opening background ad popups)
        try {
          const fakeWindow = {
            closed: true,
            close: function() {},
            focus: function() {},
            blur: function() {},
            postMessage: function() {},
            location: { href: "about:blank" }
          };
          window.open = function(url) {
            console.warn("[HAS AdGuard] Blocked popup window.open:", url);
            return fakeWindow;
          };
        } catch (_) {}

        // Prevent click hijacking on known casino/ad links
        const AD_DOMAINS = [
          "riobet", "1xbet", "vavada", "mostbet", "pin-up", "bet365",
          "adsterra", "propellerads", "popcash", "monetag", "clickadu",
          "exoclick", "juicyads", "adcash", "trafficjunky",
          "melbet", "linebet", "fonbet", "parimatch", "betboom", "vulkan", "joycasino"
        ];

        document.addEventListener("click", function(e) {
          const a = e.target && e.target.closest ? e.target.closest("a") : null;
          if (a && a.href) {
            const href = a.href.toLowerCase();
            for (let i = 0; i < AD_DOMAINS.length; i++) {
              if (href.includes(AD_DOMAINS[i])) {
                e.preventDefault();
                e.stopPropagation();
                console.warn("[HAS AdGuard] Intercepted ad click:", a.href);
                return;
              }
            }
          }
        }, true);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
